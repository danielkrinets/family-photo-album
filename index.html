<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный фотоальбом</title>
<link rel="stylesheet" href="components/glass-surface.css">
<link rel="stylesheet" href="components/infinite-menu.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-main" class="screen active">
    <div id="main-bg" class="main-bg"></div>
    <div class="main-scrim"></div>
    <div class="main-overlay">
      <h1 id="city-title" class="city-title"></h1>
      <div id="city-dock" class="city-dock">
        <div class="glass-surface__content">
          <div id="dock-ticks" class="dock-ticks"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-city" class="screen">
    <button id="btn-back-main" class="icon-btn back-btn" aria-label="Назад">&#8592;</button>
    <div id="infinite-menu-container" class="infinite-menu-container"></div>
  </section>

  <section id="screen-photo" class="screen">
    <button id="btn-close-photo" class="icon-btn close-btn" aria-label="Закрыть">&#10005;</button>
    <img id="photo-full" class="photo-full" alt="">
    <a id="btn-download" class="download-btn" download>Скачать фото</a>
  </section>

</div>

<script src="vendor/gl-matrix.min.js"></script>
<script src="data/albums.js"></script>
<script src="components/glass-surface.js"></script>
<script src="components/infinite-menu.js"></script>
<script src="app.js"></script>
</body>
</html>
