<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный фотоальбом</title>
<link rel="stylesheet" href="components/glass-surface.css">
<link rel="stylesheet" href="components/circular-gallery.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-main" class="screen active">
    <div id="main-bg" class="main-bg"></div>
    <div class="main-grain"></div>
    <div class="main-scrim"></div>
    <div class="main-overlay">
      <div class="title-wordmark">
        <img id="wordmark-image" class="wordmark-image" alt="" hidden>
        <span id="wordmark-generated" class="wordmark-generated">
          <span id="wordmark-country" class="wordmark-country">Germany</span>
          <span class="wordmark-city">
            <span class="wordmark-city-badge" aria-hidden="true">&#128737;</span>
            <span id="city-title" class="wordmark-city-name"></span>
          </span>
        </span>
      </div>
      <div id="gallery-wrap" class="gallery-wrap">
        <div id="gallery-canvas" class="gallery-canvas"></div>
      </div>
      <div class="dock-row">
        <button id="btn-home" class="dock-circle-btn" aria-label="В начало">
          <img src="assets/icons/home.svg" alt="">
        </button>
        <div id="city-dock" class="city-dock">
          <div class="glass-surface__content">
            <div id="dock-ticks" class="dock-ticks"></div>
          </div>
        </div>
        <button id="btn-open-city" class="dock-circle-btn dock-circle-btn--open" aria-label="Открыть фото">
          <img src="assets/icons/open.svg" alt="">
        </button>
      </div>
    </div>
  </section>

  <section id="screen-photo" class="screen">
    <button id="btn-close-photo" class="icon-btn close-btn" aria-label="Закрыть">&#10005;</button>
    <img id="photo-full" class="photo-full" alt="">
    <a id="btn-download" class="download-btn" download>Скачать фото</a>
  </section>

</div>

<script src="data/albums.js"></script>
<script src="components/glass-surface.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
